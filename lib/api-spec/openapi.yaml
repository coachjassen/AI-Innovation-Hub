openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Innovation Circle API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: circles
    description: Circle operations
  - name: attendees
    description: Attendee operations
  - name: meetings
    description: Meeting operations
  - name: goals
    description: Goal operations
  - name: surveys
    description: Survey operations
  - name: suggestions
    description: Suggestion operations
  - name: invites
    description: Invite operations
  - name: admin
    description: Admin operations
  - name: storage
    description: File storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Get the active sign-in mode
      responses:
        "200":
          description: Active sign-in mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /auth/direct-login:
    post:
      operationId: directAdminLogin
      tags: [auth]
      summary: Sign in directly as an administrator when explicitly enabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "200":
          description: Administrator session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "400":
          description: Invalid email address
        "401":
          description: Administrator account not found
        "403":
          description: Direct sign-in is limited to administrator accounts
        "404":
          description: Direct administrator sign-in is disabled

  /auth/request-link:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Request a magic login link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "200":
          description: Magic link sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid email address
        "502":
          description: Email delivery failed
        "503":
          description: Email delivery or public URL is not configured

  /auth/verify:
    post:
      operationId: verifyMagicLink
      tags: [auth]
      summary: Verify a magic link token and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkVerify"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "400":
          description: Invalid, expired, or already-used token

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Destroy current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "401":
          description: Not authenticated

  /auth/switch-hub:
    post:
      operationId: switchActiveHub
      tags: [auth]
      summary: Switch the current attendee membership to another recurring Hub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchHubRequest"
      responses:
        "200":
          description: Active Hub membership switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "400":
          description: Invalid Hub
        "401":
          description: Not authenticated
        "403":
          description: The signed-in email does not belong to this recurring Hub

  # Circles
  /circles:
    get:
      operationId: listCircles
      tags: [circles]
      summary: List all circles
      responses:
        "200":
          description: List of circles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Circle"
    post:
      operationId: createCircle
      tags: [circles]
      summary: Create a circle (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"

  /circles/{id}:
    get:
      operationId: getCircle
      tags: [circles]
      summary: Get a circle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"
        "404":
          description: Not found
    patch:
      operationId: updateCircle
      tags: [circles]
      summary: Update a circle (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Circle"

  /circles/{id}/registration-link:
    get:
      operationId: getHubRegistrationLink
      tags: [circles]
      summary: Get the active public Hub registration link (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active registration link state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubRegistrationLinkState"
        "400":
          description: Registration links are only available for recurring Hubs
        "404":
          description: Hub not found
        "503":
          description: Public application URL is not configured
    post:
      operationId: createHubRegistrationLink
      tags: [circles]
      summary: Create or rotate a public Hub registration link (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public registration link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubRegistrationLink"
        "400":
          description: Registration links are only available for recurring Hubs
        "404":
          description: Hub not found
        "503":
          description: Public application URL is not configured

  /circles/{id}/registrations:
    get:
      operationId: listHubRegistrations
      tags: [circles]
      summary: List public interest registrations for a Hub (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hub interest registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HubRegistration"
        "404":
          description: Hub not found

  /circles/{id}/registrations/{registrationId}:
    delete:
      operationId: deleteHubRegistration
      tags: [circles]
      summary: Remove a public interest registration (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: registrationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Registration removed
        "404":
          description: Registration not found

  /registration/{token}:
    get:
      operationId: getPublicHubRegistration
      tags: [circles]
      summary: View a public Hub registration page
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Public Hub registration details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicHubRegistration"
        "404":
          description: Registration link not found
    post:
      operationId: submitHubRegistration
      tags: [circles]
      summary: Register interest in a Hub without signing in
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HubRegistrationInput"
      responses:
        "200":
          description: Registration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid registration details or registration is closed
        "404":
          description: Registration link not found

  # Attendees
  /attendees:
    post:
      operationId: createAttendee
      tags: [attendees]
      summary: Create an attendee (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "400":
          description: Invalid attendee or Hub
        "409":
          description: Email already exists
    get:
      operationId: listAttendees
      tags: [attendees]
      summary: List attendees (admin sees all, attendee sees their circle)
      parameters:
        - name: circleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of attendees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendeeWithActivity"

  /attendees/import:
    post:
      operationId: importAttendees
      tags: [attendees]
      summary: Import attendees from CSV rows (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendeeImportInput"
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendeeImportResult"
        "400":
          description: Invalid import payload or Hub
        "403":
          description: Admin access required

  /attendees/{id}:
    get:
      operationId: getAttendee
      tags: [attendees]
      summary: Get attendee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attendee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendeeWithActivity"
        "404":
          description: Not found
    patch:
      operationId: updateAttendee
      tags: [attendees]
      summary: Update attendee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
    delete:
      operationId: deleteAttendee
      tags: [attendees]
      summary: Delete an attendee membership and its Hub activity (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Attendee deleted
        "400":
          description: Invalid attendee or administrator account
        "404":
          description: Attendee not found

  # Meetings
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meetings for the selected circle (admin) or the current attendee's invitations
      parameters:
        - name: circleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create a meeting (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /meetings/{id}:
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: Get a meeting by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Not found
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Update a meeting (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
    delete:
      operationId: deleteMeeting
      tags: [meetings]
      summary: Delete a meeting (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /meetings/{id}/response:
    put:
      operationId: setMeetingResponse
      tags: [meetings]
      summary: Set the current attendee's RSVP for a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingResponseInput"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /meetings/{id}/agenda:
    get:
      operationId: getMeetingAgenda
      tags: [meetings]
      summary: Get the ordered agenda for a meeting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ordered agenda items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
        "404":
          description: Not found
    put:
      operationId: setMeetingAgenda
      tags: [meetings]
      summary: Replace the full ordered agenda for a meeting (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaInput"
      responses:
        "200":
          description: Saved agenda items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"

  /meetings/{id}/invitees:
    get:
      operationId: listMeetingInvitees
      tags: [meetings]
      summary: List eligible Hub attendees and their invitation state (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eligible attendees and invitation state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingInvitee"
    put:
      operationId: setMeetingInvitees
      tags: [meetings]
      summary: Replace a meeting's invitee list (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInviteesInput"
      responses:
        "200":
          description: Saved invitees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingInvitee"

  /meetings/{id}/responses:
    get:
      operationId: listMeetingResponses
      tags: [meetings]
      summary: List all RSVP responses for a meeting (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingAttendeeResponse"

  /meetings/{id}/one-off-invitations/send:
    post:
      operationId: sendOneOffInvitations
      tags: [meetings]
      summary: Send first-time invitations to selected one-off event attendees (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDeliveryResult"

  /meetings/{id}/one-off-invitations/{attendeeId}/resend:
    post:
      operationId: resendOneOffInvitation
      tags: [meetings]
      summary: Resend an invitation and rotate its RSVP link (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attendeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDeliveryResult"

  /one-off-rsvp/{token}:
    get:
      operationId: getOneOffRsvp
      tags: [meetings]
      summary: Get a one-off event invitation and current RSVP without signing in
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation and RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneOffRsvp"
        "404":
          description: Invitation not found
    put:
      operationId: setOneOffRsvp
      tags: [meetings]
      summary: Set RSVP for a one-off event without signing in
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneOffRsvpInput"
      responses:
        "200":
          description: Updated RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneOffRsvp"

  /meeting-rsvp/{token}:
    get:
      operationId: getMeetingRsvp
      tags: [meetings]
      summary: Get a recurring meeting invitation and current RSVP without signing in
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation and RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingRsvp"
        "404":
          description: Invitation not found
    put:
      operationId: setMeetingRsvp
      tags: [meetings]
      summary: Set RSVP for a recurring meeting without signing in
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingResponseInput"
      responses:
        "200":
          description: Updated RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingRsvp"
        "404":
          description: Invitation not found

  # Goals
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List goals (own goals for attendee, all for admin)
      parameters:
        - name: attendeeId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: showCompleted
          in: query
          required: false
          schema:
            type: boolean
        - name: circleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalWithAttendee"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/summary:
    get:
      operationId: getGoalsSummary
      tags: [goals]
      summary: Get goals summary (counts by status)
      parameters:
        - name: circleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Goals summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsSummary"

  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a goal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Surveys
  /surveys:
    get:
      operationId: listSurveys
      tags: [surveys]
      summary: List surveys
      responses:
        "200":
          description: List of surveys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Survey"
    post:
      operationId: createSurvey
      tags: [surveys]
      summary: Create a survey (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"

  /surveys/{id}:
    get:
      operationId: getSurvey
      tags: [surveys]
      summary: Get a survey by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "404":
          description: Not found

  /surveys/{id}/responses:
    post:
      operationId: submitSurveyResponse
      tags: [surveys]
      summary: Submit a survey response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveyResponseInput"
      responses:
        "201":
          description: Response submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyResponse"
    get:
      operationId: getSurveyResponses
      tags: [surveys]
      summary: Get responses for a survey (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Survey responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveyResponse"

  # Suggestions
  /suggestions:
    get:
      operationId: listSuggestions
      tags: [suggestions]
      summary: List suggestions (admin sees all)
      parameters:
        - name: circleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestionWithAttendee"
    post:
      operationId: createSuggestion
      tags: [suggestions]
      summary: Submit a content suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"

  # Invites
  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List invites (pending invites for admin, own invites for attendee)
      parameters:
        - name: circleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteWithDetails"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Invite a colleague by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /invites/{id}:
    patch:
      operationId: updateInvite
      tags: [invites]
      summary: Approve or reject an invite (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  # Admin actions
  /admin/send-reminder:
    post:
      operationId: sendPreMeetingReminder
      tags: [admin]
      summary: Email pre-meeting reminder with open goals to all attendees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmailTrigger"
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/send-survey:
    post:
      operationId: sendPostMeetingSurvey
      tags: [admin]
      summary: Email post-meeting CSAT survey to all attendees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmailTrigger"
      responses:
        "200":
          description: Survey emails sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard overview
      parameters:
        - name: circleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [admin]
      summary: List administrator accounts
      responses:
        "200":
          description: Safe administrator account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccount"
        "401":
          description: Not authenticated
        "403":
          description: Admin access required
    post:
      operationId: createAdminAccount
      tags: [admin]
      summary: Create an administrator account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountInput"
      responses:
        "201":
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdminAccountResponse"
        "400":
          description: Invalid account or Hub
        "401":
          description: Not authenticated
        "403":
          description: Admin access required
        "409":
          description: Email already exists

  # Storage
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

components:
  schemas:
    AuthConfig:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [magic_link, direct_admin]

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # Auth
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    MagicLinkVerify:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1

    SwitchHubRequest:
      type: object
      required: [circleId]
      properties:
        circleId:
          type: integer
          minimum: 1

    # Circle
    Circle:
      type: object
      required: [id, name, cadence, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        cadence:
          type: string
          enum: [monthly, quarterly, one-off]
          description: Recurrence for the Hub, or one-off for a single event
        status:
          type: string
        createdAt:
          type: string
        memberCount:
          type: integer
        registrationDescription:
          type: ["string", "null"]
        registrationOpen:
          type: boolean
        hasRegistrationLink:
          type: boolean

    CircleInput:
      type: object
      required: [name, cadence, status]
      properties:
        name:
          type: string
        cadence:
          type: string
          enum: [monthly, quarterly, one-off]
          description: Recurrence for the Hub, or one-off for a single event
        status:
          type: string
        registrationDescription:
          type: string
        registrationOpen:
          type: boolean

    CircleUpdate:
      type: object
      properties:
        name:
          type: string
        cadence:
          type: string
          enum: [monthly, quarterly, one-off]
          description: Recurrence for the Hub, or one-off for a single event
        status:
          type: string
        registrationDescription:
          type: string
        registrationOpen:
          type: boolean

    HubRegistrationLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

    HubRegistrationLinkState:
      type: object
      required: [url, needsRotation]
      properties:
        url:
          type: ["string", "null"]
          format: uri
        needsRotation:
          type: boolean

    PublicHubRegistration:
      type: object
      required: [circleName, cadence, registrationOpen]
      properties:
        circleName:
          type: string
        cadence:
          type: string
          enum: [monthly, quarterly]
        description:
          type: ["string", "null"]
        registrationOpen:
          type: boolean

    HubRegistration:
      type: object
      required: [id, circleId, name, email, company, attendeeId, promotedAt, createdAt]
      properties:
        id:
          type: integer
        circleId:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        attendeeId:
          type: ["integer", "null"]
        promotedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    HubRegistrationInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        company:
          type: string
          maxLength: 200

    # Attendee
    Attendee:
      type: object
      required: [id, name, email, company, role, circleId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        company:
          type: string
        role:
          type: string
        circleId:
          type: integer
        createdAt:
          type: string

    AttendeeInput:
      type: object
      required: [name, email, circleId]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        circleId:
          type: integer

    AttendeeImportRow:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        company:
          type: string

    AttendeeImportInput:
      type: object
      required: [circleId, attendees]
      properties:
        circleId:
          type: integer
        attendees:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AttendeeImportRow"

    AttendeeImportSkippedRow:
      type: object
      required: [row, email, reason]
      properties:
        row:
          type: integer
        email:
          type: string
        reason:
          type: string
          enum: [duplicate_file, duplicate_existing]

    AttendeeImportResult:
      type: object
      required: [createdCount, skippedCount, created, skipped]
      properties:
        createdCount:
          type: integer
        skippedCount:
          type: integer
        created:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeImportSkippedRow"

    AttendeeWithActivity:
      type: object
      required: [id, name, email, company, role, circleId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        company:
          type: string
        role:
          type: string
        circleId:
          type: integer
        createdAt:
          type: string
        lastActivityAt:
          type: ["string", "null"]
        goalCount:
          type: integer
        surveyResponseCount:
          type: integer

    AdminAccount:
      type: object
      required: [id, name, email, company, role, circleId, circleName, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        role:
          type: string
          enum: [admin]
        circleId:
          type: integer
        circleName:
          type: string
        createdAt:
          type: string

    AdminAccountInput:
      type: object
      required: [name, email, circleId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        company:
          type: string
        circleId:
          type: integer
          minimum: 1

    CreateAdminAccountResponse:
      allOf:
        - $ref: "#/components/schemas/AdminAccount"
        - type: object
          required: [onboardingEmailStatus, message]
          properties:
            onboardingEmailStatus:
              type: string
              enum: [sent, unavailable, rate_limited, failed]
            message:
              type: string

    AttendeeUpdate:
      type: object
      properties:
        name:
          type: string
        company:
          type: string

    # Meeting
    Meeting:
      type: object
      required: [id, circleId, date, createdAt]
      properties:
        id:
          type: integer
        circleId:
          type: integer
        date:
          type: string
        notes:
          type: ["string", "null"]
        slidesPath:
          type: ["string", "null"]
        keyInsight:
          type: ["string", "null"]
        invitationBody:
          type: ["string", "null"]
        invitationAttachmentPath:
          type: ["string", "null"]
        invitationAttachmentName:
          type: ["string", "null"]
        invitationAttachmentContentType:
          type: ["string", "null"]
        createdAt:
          type: string
        myResponse:
          type: ["string", "null"]
        attendingCount:
          type: integer
        notAttendingCount:
          type: integer
        totalInvited:
          type: integer

    MeetingResponseInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [attending, not_attending]

    MeetingInviteesInput:
      type: object
      required: [attendeeIds]
      properties:
        attendeeIds:
          type: array
          uniqueItems: true
          items:
            type: integer

    MeetingInvitee:
      type: object
      required: [attendeeId, attendeeName, attendeeEmail, attendeeCompany, invited, invitationSentAt, invitationSendCount]
      properties:
        attendeeId:
          type: integer
        attendeeName:
          type: string
        attendeeEmail:
          type: string
        attendeeCompany:
          type: string
        invited:
          type: boolean
        invitationSentAt:
          type: ["string", "null"]
        invitationSendCount:
          type: integer

    InvitationDeliveryFailure:
      type: object
      required: [attendeeId, attendeeName, error]
      properties:
        attendeeId:
          type: integer
        attendeeName:
          type: string
        error:
          type: string

    InvitationDeliveryResult:
      type: object
      required: [sentCount, failures]
      properties:
        sentCount:
          type: integer
        failures:
          type: array
          items:
            $ref: "#/components/schemas/InvitationDeliveryFailure"

    OneOffRsvp:
      type: object
      required: [meetingId, circleName, date, status]
      properties:
        meetingId:
          type: integer
        circleName:
          type: string
        date:
          type: string
        invitationBody:
          type: ["string", "null"]
        status:
          type: string
          enum: [attending, not_attending, no_response]

    OneOffRsvpInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [attending, not_attending]

    MeetingRsvp:
      type: object
      required: [meetingId, circleName, date, attendeeName, status]
      properties:
        meetingId:
          type: integer
        circleName:
          type: string
        date:
          type: string
        attendeeName:
          type: string
        status:
          type: string
          enum: [attending, not_attending, no_response]

    MeetingAttendeeResponse:
      type: object
      required: [attendeeId, attendeeName, status]
      properties:
        attendeeId:
          type: integer
        attendeeName:
          type: string
        attendeeCompany:
          type: string
        status:
          type: string
          enum: [attending, not_attending, no_response]

    AgendaItem:
      type: object
      required: [id, meetingId, position, title]
      properties:
        id:
          type: integer
        meetingId:
          type: integer
        position:
          type: integer
        title:
          type: string
        durationMinutes:
          type: ["integer", "null"]
        presenter:
          type: ["string", "null"]
        description:
          type: ["string", "null"]

    AgendaItemInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        durationMinutes:
          type: ["integer", "null"]
        presenter:
          type: ["string", "null"]
        description:
          type: ["string", "null"]

    AgendaInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgendaItemInput"

    MeetingInput:
      type: object
      required: [circleId, date]
      properties:
        circleId:
          type: integer
        date:
          type: string
        notes:
          type: string
        slidesPath:
          type: string
        keyInsight:
          type: string

    MeetingUpdate:
      type: object
      properties:
        date:
          type: string
        notes:
          type: string
        slidesPath:
          type: string
        keyInsight:
          type: string
        invitationBody:
          type: string
        invitationAttachmentPath:
          type: string
        invitationAttachmentName:
          type: string
        invitationAttachmentContentType:
          type: string

    # Goal
    Goal:
      type: object
      required: [id, attendeeId, timeframe, status, createdAt]
      properties:
        id:
          type: integer
        attendeeId:
          type: integer
        timeframe:
          type: string
        status:
          type: string
        comments:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    GoalWithAttendee:
      type: object
      required: [id, attendeeId, timeframe, status, createdAt]
      properties:
        id:
          type: integer
        attendeeId:
          type: integer
        timeframe:
          type: string
        status:
          type: string
        comments:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        attendeeName:
          type: string
        attendeeCompany:
          type: string

    GoalInput:
      type: object
      required: [timeframe, status]
      properties:
        timeframe:
          type: string
        status:
          type: string
        comments:
          type: string
        dueDate:
          type: ["string", "null"]

    GoalUpdate:
      type: object
      properties:
        timeframe:
          type: string
        status:
          type: string
        comments:
          type: string
        dueDate:
          type: ["string", "null"]

    GoalsSummary:
      type: object
      required: [total, byStatus]
      properties:
        total:
          type: integer
        byStatus:
          type: object
          properties:
            new:
              type: integer
            inProgress:
              type: integer
            completed:
              type: integer
            notStarted:
              type: integer

    # Survey
    Survey:
      type: object
      required: [id, meetingId, type, questions, createdAt]
      properties:
        id:
          type: integer
        meetingId:
          type: integer
        type:
          type: string
        questions:
          type: array
          items:
            type: string
        createdAt:
          type: string

    SurveyInput:
      type: object
      required: [meetingId, type, questions]
      properties:
        meetingId:
          type: integer
        type:
          type: string
        questions:
          type: array
          items:
            type: string

    SurveyResponse:
      type: object
      required: [id, surveyId, attendeeId, answers, createdAt]
      properties:
        id:
          type: integer
        surveyId:
          type: integer
        attendeeId:
          type: integer
        answers:
          type: array
          items:
            type: string
        createdAt:
          type: string

    SurveyResponseInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: string

    # Suggestion
    Suggestion:
      type: object
      required: [id, attendeeId, content, createdAt]
      properties:
        id:
          type: integer
        attendeeId:
          type: integer
        meetingId:
          type: ["integer", "null"]
        content:
          type: string
        createdAt:
          type: string

    SuggestionWithAttendee:
      type: object
      required: [id, attendeeId, content, createdAt, attendeeName, attendeeCompany]
      properties:
        id:
          type: integer
        attendeeId:
          type: integer
        meetingId:
          type: ["integer", "null"]
        content:
          type: string
        createdAt:
          type: string
        attendeeName:
          type: string
        attendeeCompany:
          type: string

    SuggestionInput:
      type: object
      required: [content]
      properties:
        meetingId:
          type: integer
        content:
          type: string

    # Invite
    Invite:
      type: object
      required: [id, invitedByAttendeeId, email, circleId, status, createdAt]
      properties:
        id:
          type: integer
        invitedByAttendeeId:
          type: integer
        email:
          type: string
        circleId:
          type: integer
        status:
          type: string
        createdAt:
          type: string

    InviteWithDetails:
      type: object
      required: [id, invitedByAttendeeId, email, circleId, status, createdAt, invitedByName]
      properties:
        id:
          type: integer
        invitedByAttendeeId:
          type: integer
        email:
          type: string
        circleId:
          type: integer
        status:
          type: string
        createdAt:
          type: string
        invitedByName:
          type: string
        circleName:
          type: string

    InviteInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    InviteUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # Admin
    AdminEmailTrigger:
      type: object
      required: [circleId]
      properties:
        circleId:
          type: integer
        meetingId:
          type: integer

    AdminDashboard:
      type: object
      required: [totalAttendees, totalMeetings, totalGoals, goalsByStatus, recentActivity]
      properties:
        totalAttendees:
          type: integer
        totalMeetings:
          type: integer
        totalGoals:
          type: integer
        goalsByStatus:
          type: object
          properties:
            new:
              type: integer
            inProgress:
              type: integer
            completed:
              type: integer
            notStarted:
              type: integer
        pendingInvites:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    ActivityItem:
      type: object
      required: [type, description, createdAt]
      properties:
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string
        attendeeName:
          type: ["string", "null"]

    # Storage
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
