name: Deploy Kinetics Group Innovation Hubs

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Do not deploy two commits at the same time on the same server.
concurrency:
  group: kinetics-hubs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Update kam-ubuntu-01
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Run server update script
        shell: bash
        working-directory: /home/administrator/Projects/AI-Innovation-Hub
        run: |
          set -Eeuo pipefail

          if [[ ! -f ./update.sh ]]; then
            echo "::error::update.sh was not found in $(pwd)"
            exit 1
          fi

          chmod +x ./update.sh
          ./update.sh